AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  resp-bench fire-and-forget benchmark runner. Launches a single stock
  Amazon Linux 2023 (x86_64) EC2 instance that provisions its own toolchain,
  runs a benchmark sweep, publishes the report + raw results + run metadata to
  S3 under runs/<job_id>/, and then TERMINATES ITSELF. A CreationPolicy +
  cfn-signal gate makes stack creation block until provisioning is genuinely
  healthy (and roll back otherwise). After the instance self-terminates the
  only leftover is this stack's free shell (security group + IAM role); remove
  it with `aws cloudformation delete-stack` (see infra/README.md).

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:

  JobId:
    Type: String
    Description: >-
      Unique run id, generated by bench-aws.sh as
      [prefix-]bench-YYYYMMDD-HHMMSS-<6 random>. Used as the S3 prefix
      (runs/<JobId>/) and the RunId tag.
    AllowedPattern: "^[a-zA-Z0-9._-]+$"

  MatrixName:
    Type: String
    Default: valkey-glide-basic-multiclients
    Description: >-
      Matrix config name (without path/extension) under configs/matrices/.
      Defaults to the smallest shipped matrix as a smoke run; pass a larger
      one explicitly for a real sweep.

  RepoUrl:
    Type: String
    Default: https://github.com/Bit-Quill/resp-bench.git
    Description: Public git URL of the resp-bench fork to clone.

  RepoTag:
    Type: String
    Default: main
    Description: >-
      Git ref (tag/branch/sha) to check out. SHOULD be a tag that includes the
      Phase-0 correctness fixes (fail-loud runner, honest exit code, CLI-based
      flush). On raw main the sweep may fail at the flush step; that is expected
      and out of scope for this template — the run still uploads diagnostics and
      self-terminates.

  InstanceType:
    Type: String
    Default: m5.large
    Description: >-
      EC2 instance type (on-demand). The default is a small, cheap smoke-run
      size. For a fidelity-grade sweep use a dedicated/metal type (e.g.
      m5.metal or c5.metal) and pin the CPU model for run-to-run comparability.

  RuntimeCapMinutes:
    Type: Number
    Default: 180
    MinValue: 5
    MaxValue: 1440
    Description: >-
      Hard runtime cap. The instance schedules `shutdown -h +N` at boot so a
      hung run cannot bill indefinitely. Conservative default of 3 hours.

  S3Bucket:
    Type: String
    Default: valkey-glide-resp-bench
    Description: >-
      Destination S3 bucket. Results land under s3://<bucket>/runs/<JobId>/.
      The instance role is scoped to s3:PutObject on runs/* of this bucket only.

  BaseAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Base AMI, resolved at deploy time from the public SSM parameter for the
      latest AL2023 x86_64 image. Never a hardcoded AMI id.

  RootVolumeSizeGb:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 500
    Description: Root EBS volume size (GiB). Deleted on termination.

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # Least-privilege instance profile: SSM core (for optional interactive
  # debugging / patch compliance) + s3:PutObject scoped to this bucket's runs/*
  # + cloudformation:SignalResource scoped to THIS stack (for the CreationPolicy
  # gate). Notably NO ec2:TerminateInstances — the box self-terminates via
  # InstanceInitiatedShutdownBehavior below, so no terminate permission exists.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PutBenchmarkResults
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${S3Bucket}/runs/*"
        - PolicyName: SignalOwnStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId
      Tags:
        - Key: Project
          Value: resp-bench

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # No inbound rules at all: this is a single colocated box (client + server on
  # the same host over localhost:6379), so nothing needs to reach it. We omit
  # SecurityGroupIngress entirely (no public ingress) and omit
  # SecurityGroupEgress so the group keeps its default allow-all egress — which
  # the instance needs to clone the repo, install toolchains, and PUT to S3.
  # (An explicit egress block would force declaring a VpcId; omitting it lets
  # the group be created in the account's default VPC.)
  BenchmarkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        resp-bench runner - no public ingress; default allow-all egress only.
        The Valkey server is reached only over localhost within the instance.
      Tags:
        - Key: Project
          Value: resp-bench
        - Key: RunId
          Value: !Ref JobId

  BenchmarkInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        # Blocks stack creation until run-remote.sh signals SUCCESS (server up
        # and healthy) or FAILURE (rolls back). Generous timeout to cover the
        # ~10-20 min launch-time toolchain install.
        Count: 1
        Timeout: PT45M
    Properties:
      ImageId: !Ref BaseAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt BenchmarkSecurityGroup.GroupId
      # Self-terminate (not stop) when the run script calls `shutdown -h now`,
      # or when the runtime-cap timer fires. Compute + EBS gone, $0, with NO
      # ec2:TerminateInstances permission on the instance role.
      InstanceInitiatedShutdownBehavior: terminate
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGb
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Project
          Value: resp-bench
        - Key: RunId
          Value: !Ref JobId
        - Key: Name
          Value: !Sub "resp-bench-${JobId}"
      # UserData is deliberately thin: install git, clone the fork at the pinned
      # ref, run the cloud-agnostic provision.sh, then hand off to the on-instance
      # run script (which owns server start, the cfn-signal gate, the sweep, the
      # S3 upload, and self-termination — all under a trap). The real logic lives
      # in reviewable repo scripts, not in this YAML.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          REGION="${AWS::Region}"
          STACK_NAME="${AWS::StackName}"
          SIGNAL_RESOURCE="BenchmarkInstance"

          # IMDSv2: fetch a token and this instance's id (for signalling +
          # run metadata). This AWS-specific plumbing lives in UserData/the
          # run script, never in provision.sh.
          TOKEN=$(curl -sS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300" || true)
          INSTANCE_ID=$(curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id || true)

          # If provisioning fails before the run script sends its SUCCESS
          # signal, fail the stack fast instead of waiting out the timeout.
          # First preserve the provisioning log to S3: the stack rolls back and
          # terminates the instance on FAILURE, taking its console output with
          # it, so this is the only durable record of a provision-phase failure.
          signal_failure() {
            aws s3 cp /var/log/cloud-init-output.log \
              "s3://${S3Bucket}/runs/${JobId}/provision-failure.log" \
              --region "$REGION" || true
            aws cloudformation signal-resource --region "$REGION" \
              --stack-name "$STACK_NAME" --logical-resource-id "$SIGNAL_RESOURCE" \
              --unique-id "$INSTANCE_ID" --status FAILURE || true
          }
          trap signal_failure ERR

          dnf install -y git

          REPO_DIR=/opt/resp-bench
          git clone --depth 1 --branch "${RepoTag}" "${RepoUrl}" "$REPO_DIR"

          # Cloud-agnostic toolchain install + engine build + cache warm-up.
          export REPO_DIR
          bash "$REPO_DIR/infra/provision.sh"

          # Provisioning succeeded; hand off. The run script sends the
          # CreationPolicy SUCCESS signal itself once the server is healthy.
          trap - ERR
          export JOB_ID="${JobId}"
          export S3_BUCKET="${S3Bucket}"
          export MATRIX_NAME="${MatrixName}"
          export REPO_TAG="${RepoTag}"
          export RUNTIME_CAP_MINUTES="${RuntimeCapMinutes}"
          export AWS_REGION="$REGION"
          export STACK_NAME
          export CFN_SIGNAL_RESOURCE="$SIGNAL_RESOURCE"
          export CFN_INSTANCE_ID="$INSTANCE_ID"
          bash "$REPO_DIR/infra/aws/run-remote.sh"

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:

  JobId:
    Description: The run id / S3 prefix segment.
    Value: !Ref JobId

  S3Prefix:
    Description: Where results will appear.
    Value: !Sub "s3://${S3Bucket}/runs/${JobId}/"

  InstanceId:
    Description: The (self-terminating) benchmark instance.
    Value: !Ref BenchmarkInstance

  StackName:
    Description: Delete this stack after reading results to remove the free shell (SG + role).
    Value: !Ref AWS::StackName
