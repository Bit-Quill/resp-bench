name: Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark-java:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        driver: 
          - configs/drivers/default/jedis.json
          - configs/drivers/default/lettuce.json
          - configs/drivers/default/redisson.json
          - configs/drivers/default/spring-data-redis-jedis.json
          - configs/drivers/default/spring-data-redis-lettuce.json
          - configs/drivers/default/spring-data-valkey-glide.json
          - configs/drivers/default/spring-data-valkey-jedis.json
          - configs/drivers/default/spring-data-valkey-lettuce.json
          - configs/drivers/default/valkey-glide.json
        workload:
          - configs/workloads/reference/basic-standalone-single-client-1M-reqs.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Start Valkey server
        run: |
          # Use Makefile target which builds from source and configures with persistence disabled
          make server-standalone-start
          # Wait for server to be ready
          sleep 2
          # Verify server is up and persistence is disabled
          work/valkey/bin/valkey-cli ping
          work/valkey/bin/valkey-cli CONFIG GET save

      - name: Build Java benchmark
        run: |
          cd java
          mvn -B package -DskipTests

      - name: Extract names for result file
        id: names
        run: |
          DRIVER_NAME=$(basename ${{ matrix.driver }} .json)
          WORKLOAD_NAME=$(basename ${{ matrix.workload }} .json)
          echo "driver_name=$DRIVER_NAME" >> $GITHUB_OUTPUT
          echo "workload_name=$WORKLOAD_NAME" >> $GITHUB_OUTPUT
          echo "result_file=results/github-runner/reference/${DRIVER_NAME}-${WORKLOAD_NAME}.ndjson" >> $GITHUB_OUTPUT

      - name: Run benchmark
        run: |
          mkdir -p results/github-runner/reference
          java -jar java/target/resp-bench-java-1.0.0-SNAPSHOT.jar \
            --server localhost:6379 \
            --driver ${{ matrix.driver }} \
            --workload ${{ matrix.workload }} \
            --metrics ${{ steps.names.outputs.result_file }} \
            --commit-id ${{ github.sha }}

      - name: Stop Valkey server
        if: always()
        run: |
          make server-standalone-stop || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-java-${{ steps.names.outputs.driver_name }}-${{ steps.names.outputs.workload_name }}
          path: ${{ steps.names.outputs.result_file }}
          retention-days: 30

  benchmark-ruby:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        driver: 
          - configs/drivers/default/redis-rb.json
          - configs/drivers/default/valkey-glide-ruby.json
        workload:
          - configs/workloads/reference/basic-standalone-single-client-1M-reqs.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ruby

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Start Valkey server
        run: |
          # Use Makefile target which builds from source and configures with persistence disabled
          make server-standalone-start
          # Wait for server to be ready
          sleep 2
          # Verify server is up and persistence is disabled
          work/valkey/bin/valkey-cli ping
          work/valkey/bin/valkey-cli CONFIG GET save

      - name: Extract names for result file
        id: names
        run: |
          DRIVER_NAME=$(basename ${{ matrix.driver }} .json)
          WORKLOAD_NAME=$(basename ${{ matrix.workload }} .json)
          echo "driver_name=$DRIVER_NAME" >> $GITHUB_OUTPUT
          echo "workload_name=$WORKLOAD_NAME" >> $GITHUB_OUTPUT
          echo "result_file=results/github-runner/reference/${DRIVER_NAME}-${WORKLOAD_NAME}.ndjson" >> $GITHUB_OUTPUT

      - name: Run benchmark
        run: |
          mkdir -p results/github-runner/reference
          cd ruby && bundle exec ruby bin/resp-bench \
            --server localhost:6379 \
            --driver ../${{ matrix.driver }} \
            --workload ../${{ matrix.workload }} \
            --metrics ../${{ steps.names.outputs.result_file }} \
            --commit-id ${{ github.sha }}

      - name: Stop Valkey server
        if: always()
        run: |
          make server-standalone-stop || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ruby-${{ steps.names.outputs.driver_name }}-${{ steps.names.outputs.workload_name }}
          path: ${{ steps.names.outputs.result_file }}
          retention-days: 30

  test-php:
    # Fast, server-free PHP engine tests. Uses the recording driver, so it needs
    # neither the valkey_glide extension nor a running server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pcntl
          tools: composer

      - name: Install PHP dependencies
        run: cd php && composer install --no-interaction --prefer-dist

      - name: Run PHP unit tests
        run: cd php && vendor/bin/phpunit --testsuite unit

      - name: Run PHP integration tests (server-free)
        run: cd php && vendor/bin/phpunit --testsuite integration

  benchmark-php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        driver:
          - configs/drivers/default/valkey-glide-php.json
        workload:
          - configs/workloads/reference/basic-standalone-single-client-1M-reqs.json

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pcntl, bcmath
          tools: composer

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential php-dev pkg-config \
            libssl-dev libffi-dev libprotobuf-c-dev protobuf-c-compiler unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build & install valkey_glide extension
        run: |
          # Build the Valkey GLIDE PHP extension from the upstream repo.
          git clone --recurse-submodules https://github.com/valkey-io/valkey-glide-php.git /tmp/vg-php
          cd /tmp/vg-php
          python3 utils/patch_proto_and_rust.py
          (cd valkey-glide/ffi && cargo build --release)
          phpize
          ./configure --enable-valkey-glide
          make build-modules-pre
          make -j"$(nproc)"
          sudo make install
          echo "extension=valkey_glide" | sudo tee -a "$(php -i | grep '^Loaded Configuration File' | awk '{print $NF}')"
          php -m | grep valkey_glide

      - name: Install PHP dependencies
        run: cd php && composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Start Valkey server
        run: |
          make server-standalone-start
          sleep 2
          work/valkey/bin/valkey-cli ping
          work/valkey/bin/valkey-cli CONFIG GET save

      - name: Extract names for result file
        id: names
        run: |
          DRIVER_NAME=$(basename ${{ matrix.driver }} .json)
          WORKLOAD_NAME=$(basename ${{ matrix.workload }} .json)
          echo "driver_name=$DRIVER_NAME" >> $GITHUB_OUTPUT
          echo "workload_name=$WORKLOAD_NAME" >> $GITHUB_OUTPUT
          echo "result_file=results/github-runner/reference/${DRIVER_NAME}-${WORKLOAD_NAME}.ndjson" >> $GITHUB_OUTPUT

      - name: Run benchmark
        run: |
          mkdir -p results/github-runner/reference
          php php/bin/resp-bench \
            --server localhost:6379 \
            --driver ${{ matrix.driver }} \
            --workload ${{ matrix.workload }} \
            --metrics ${{ steps.names.outputs.result_file }} \
            --commit-id ${{ github.sha }}

      - name: Stop Valkey server
        if: always()
        run: |
          make server-standalone-stop || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-php-${{ steps.names.outputs.driver_name }}-${{ steps.names.outputs.workload_name }}
          path: ${{ steps.names.outputs.result_file }}
          retention-days: 30

  generate-graphs:
    needs: [benchmark-java, benchmark-ruby, benchmark-php]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results/github-runner/reference
          pattern: benchmark-*
          merge-multiple: true

      - name: List downloaded results
        run: |
          echo "Downloaded results:"
          find results -name "*.ndjson" -type f

      # TODO - rework with matrix orchistrator
      - name: Generate Java graphs - 1 Client
        run: |
          python scripts/generate_graphs.py \
            --results "results/github-runner/reference/*-basic-standalone-single-client-1M-reqs.ndjson" \
            --output graphs/java/1-client/ \
            --phase STEADY \
            --language java \
            --workload "Java - 1 Client" \
            --commit-id ${{ github.sha }}

      - name: Generate Java graphs - 10 Clients
        run: |
          python scripts/generate_graphs.py \
            --results "results/github-runner/reference/*-basic-standalone-10-clients.ndjson" \
            --output graphs/java/10-clients/ \
            --phase STEADY \
            --language java \
            --workload "Java - 10 Clients" \
            --commit-id ${{ github.sha }}

      - name: Generate Java graphs - 100 Clients
        run: |
          python scripts/generate_graphs.py \
            --results "results/github-runner/reference/*-basic-standalone-100-clients.ndjson" \
            --output graphs/java/100-clients/ \
            --phase STEADY \
            --language java \
            --workload "Java - 100 Clients" \
            --commit-id ${{ github.sha }}

      # Ruby graphs — per concurrency level
      - name: Generate Ruby graphs - 1 Client
        run: |
          python scripts/generate_graphs.py \
            --results "results/github-runner/reference/*-basic-standalone-single-client-1M-reqs.ndjson" \
            --output graphs/ruby/1-client/ \
            --phase STEADY \
            --language ruby \
            --workload "Ruby - 1 Client" \
            --commit-id ${{ github.sha }}

      - name: Generate Ruby graphs - 10 Clients
        run: |
          python scripts/generate_graphs.py \
            --results "results/github-runner/reference/*-basic-standalone-10-clients.ndjson" \
            --output graphs/ruby/10-clients/ \
            --phase STEADY \
            --language ruby \
            --workload "Ruby - 10 Clients" \
            --commit-id ${{ github.sha }}

      - name: Generate Ruby graphs - 100 Clients
        run: |
          python scripts/generate_graphs.py \
            --results "results/github-runner/reference/*-basic-standalone-100-clients.ndjson" \
            --output graphs/ruby/100-clients/ \
            --phase STEADY \
            --language ruby \
            --workload "Ruby - 100 Clients" \
            --commit-id ${{ github.sha }}

      - name: Upload graphs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-graphs
          path: graphs/
          retention-days: 30

      - name: Create PR with updated graphs
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update benchmark graphs"
          title: "🔄 Update benchmark graphs"
          body: |
            This PR updates the benchmark comparison graphs from the latest CI run.
            
            Commit: ${{ github.sha }}
            Run: ${{ github.run_id }}
          branch: update-benchmark-graphs
          delete-branch: true
          add-paths: |
            graphs/
